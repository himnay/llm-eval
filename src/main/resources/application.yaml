spring:
  application:
    name: llm-eval

eval:
  request-timeout-seconds: ${EVAL_REQUEST_TIMEOUT_SECONDS:600}

  # Default LLM-as-judge model for POST /api/ask-judge (overridable per-request via "judge").
  # Must name an entry in `judges` below, not `systems` — kept as a separate list so the judge
  # model doesn't show up in GET /api/systems / get treated as a system under test.
  judge-system: qwen3:4b
  judges:
    - name: qwen3:4b
      url: ${OLLAMA_URL:http://localhost:11434}/api/generate
      question-field: prompt
      answer-field: response
      extra-request-fields:
        model: qwen3:4b
        stream: false
        # skip the hidden reasoning pass — judge only needs the JSON verdict, and
        # thinking tokens dominate latency on a 4B CPU/iGPU model
        think: false

  systems:
    # Every entry hits the same local Ollama daemon (http://localhost:11434/api/generate) — only
    # `model` in extra-request-fields differs. Swapping or adding a locally-downloaded model is a
    # config-only change: no Java edit needed.
    # Ordered smallest to largest by parameter count (per `ollama list`), so a run burns through
    # the cheap/fast models first.
#    - name: qwen3:4b                 # 4.0B
#      url: ${OLLAMA_URL:http://localhost:11434}/api/generate
#      question-field: prompt
#      answer-field: response
#      extra-request-fields:
#        model: qwen3:4b
#        stream: false
#    - name: mistral:latest           # 7.2B
#      url: ${OLLAMA_URL:http://localhost:11434}/api/generate
#      question-field: prompt
#      answer-field: response
#      extra-request-fields:
#        model: mistral:latest
#        stream: false
#    - name: qwen2.5-coder:7b         # 7.6B
#      url: ${OLLAMA_URL:http://localhost:11434}/api/generate
#      question-field: prompt
#      answer-field: response
#      extra-request-fields:
#        model: qwen2.5-coder:7b
#        stream: false
#    - name: gemma2:9b                # 9.2B
#      url: ${OLLAMA_URL:http://localhost:11434}/api/generate
#      question-field: prompt
#      answer-field: response
#      extra-request-fields:
#        model: gemma2:9b
#        stream: false
#    - name: gemma4:12b               # 11.9B
#      url: ${OLLAMA_URL:http://localhost:11434}/api/generate
#      question-field: prompt
#      answer-field: response
#      extra-request-fields:
#        model: gemma4:12b
#        stream: false
    - name: bonsai:27b               # 27.3B, ternary Q1_0 quant (~3.8GB)
      url: ${OLLAMA_URL:http://localhost:11434}/api/generate
      question-field: prompt
      answer-field: response
      extra-request-fields:
        model: bonsai:27b
        stream: false
        # model embeds its reasoning in the response and runs ~12 tok/s on the iGPU —
        # uncapped answers take minutes; 512 tokens ≈ 45s worst case
        options:
          num_predict: 512
